# Espace mondial l'atlas — configuration nginx proposée pour l'hébergement statique
# (domaine espace-mondial-atlas.sciencespo.fr, racine = contenu de dist-prod/).
#
# Modèle à adapter par le pôle réseau (chemin racine interne, inclusion au niveau
# `server`, comme /cartographie_upload/conf/sveltekit.conf pour le site de l'Atelier).
# Le site fonctionne aussi SANS ces règles (liens relatifs, index.html racine qui
# redirige vers /fr/) : elles améliorent seulement les redirections et les 404.

# Compression des formats texte (dont l'index de recherche JSON : 2,2 Mo -> 0,65 Mo)
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# Pas d'index de dossiers
autoindex off;

# Racine -> accueil français (redirection serveur, en https)
location = / {
    absolute_redirect off;
    return 301 /fr/;
}

# Pages françaises (et ressources communes : /assets, /media)
location / {
    absolute_redirect off;
    try_files $uri $uri/index.html =404;
    # Page d'erreur servie avec le code 404 (chemin commençant par « / », sinon 302)
    error_page 404 /fr/introuvable.html;
}

# Pages anglaises : page 404 en anglais
location /en/ {
    absolute_redirect off;
    try_files $uri $uri/index.html =404;
    error_page 404 /en/not-found.html;
}

# Polices et librairies locales : jamais modifiées
location /assets/vendor/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# Images et médias : jamais modifiés, cache navigateur long
location /media/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# Ancien backoffice et ancienne API : supprimés définitivement
location ^~ /backoffice { return 410; }
location ^~ /backend    { return 410; }
